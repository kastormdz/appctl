user  app;
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;
    sendfile      on;
    server_tokens off;
    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;

        # El build de React. El entrypoint lo deja aca: es la MISMA ruta para
        # un `dist/` de Vite, un `build/` de CRA o el stub de verificacion.
        root /app/frontend-dist;
        index index.html;

        # ---- la API: Express ----
        # /api va al backend. SIN barra final en proxy_pass: con
        # `proxy_pass http://127.0.0.1:3000/` nginx le come el prefijo /api y
        # las rutas del cliente (`app.get('/api/x')`) dejan de matchear. Con
        # la URL pelada, el path llega completo y el cliente decide.
        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # El stub del backend contesta /healthz (y el de Next tambien lo hacia
        # por aca). No lo usa el healthcheck del contenedor — ese mira que
        # nginx conteste — pero si lo mira cualquiera que quiera ver el runtime.
        location = /healthz {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ---- los estaticos del build ----
        # Un asset que no existe devuelve 404, NO el index.html: si el fallback
        # SPA se come tambien los .js/.css, el navegador recibe HTML donde
        # espera un modulo y el error que se ve es "Unexpected token '<'", que
        # no dice nada de la causa real (un build viejo o incompleto).
        location ~* \.(js|mjs|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|map)$ {
            try_files $uri =404;
        }

        # ---- el resto: la SPA ----
        # React Router maneja las rutas en el cliente: /clientes/7 no es un
        # archivo, asi que cualquier ruta desconocida tiene que devolver el
        # index.html y no un 404.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
