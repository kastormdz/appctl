[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

# El backend del cliente (Express). El command NO es `node server.js` fijo: el
# entrypoint escribe /app/start.sh segun lo que haya subido el cliente (su
# server.js, o el script `start` de su package.json, o el stub de Express).
# Asi el stack no obliga a una convencion de arranque que el cliente no tiene.
[program:express]
command=/app/start.sh
directory=/app/backend
user=app
autostart=true
autorestart=true
priority=20
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0",HOME="/home/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=/usr/sbin/crond -f -l 8 -L /dev/stdout
# solo corre si el proyecto pidio cron.
autostart=false
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxsize=0
stderr_logfile=/dev/stderr
stderr_logfile_maxsize=0
