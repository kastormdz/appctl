user  app;
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;
    sendfile      on;
    server_tokens off;
    client_max_body_size 32m;

    # Node ya sabe servir estaticos y tiene su propio manejo de cache. nginx
    # solo hace de reverse proxy: duplicar el cache en dos lados sirve para
    # nada y confunde cuando uno de los dos deja de tener el archivo.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;

        location = /healthz {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            # websocket: sin esto, el dev con HMR ve "connection failed"
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }
    }
}
