[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

# Next standalone: node server.js, NO `next start`.
#
# El build de Next tiene que emitir output:'standalone' en next.config
# (el entrypoint lo verifica). El server standalone usa mucho menos RAM
# que el server completo de Next: con 15 clientes en un server de 15 GB,
# esa diferencia decide si entran o no.
[program:next]
command=/usr/bin/node /app/server.js
directory=/app
user=app
autostart=true
autorestart=true
priority=20
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0",
            NEXT_TELEMETRY_DISABLED="1",HOME="/home/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# La API Python. El comando real vive en python-launch.sh: ahi se decide el
# target de uvicorn segun lo que subio el cliente (main:app o app.main:app)
# y se usa el venv de la imagen.
#
# priority 25: despues de nginx (10) y de next (20), antes de sshd (30).
# PYTHONDONTWRITEBYTECODE: sin esto, uvicorn escribe __pycache__ en /app
# (que es del usuario app) y el codigo del cliente se llena de .pyc que
# despues aparecen por SFTP.
[program:python]
command=/usr/local/bin/python-launch.sh
directory=/app/backend
user=app
autostart=true
autorestart=true
priority=25
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1",HOME="/home/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=/usr/sbin/crond -f -l 8 -L /dev/stdout
# solo corre si el proyecto pidio cron: sin esto, todos los stacks
# tendrian un cron corriendo vacio.
autostart=false
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxsize=0
stderr_logfile=/dev/stderr
stderr_logfile_maxsize=0
