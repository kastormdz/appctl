user  app;
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;
    sendfile      on;
    server_tokens off;
    client_max_body_size 32m;

    # Node y uvicorn ya saben servir lo suyo y tienen su propio manejo de
    # cache. nginx solo hace de reverse proxy: duplicar el cache en dos
    # lados sirve para nada y confunde cuando uno de los dos deja de tener
    # el archivo.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;

        # /private es hermano de /upload dentro del chroot del SFTP. Aca no
        # hay `root`: todo sale por proxy, asi que este path no se puede
        # servir de ninguna forma. La barrera queda igual como defensa en
        # profundidad: el dia que alguien agregue un server block con root,
        # el nombre ya esta blindado.
        location ^~ /private/ {
            deny all;
        }
        location = /private {
            deny all;
        }

        # /healthz de Next. Es el que usa el healthcheck del contenedor.
        location = /healthz {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # La API Python. El prefijo /api/ SE SACA al reenviar: si el cliente
        # define @app.get("/items"), el publico lo ve en /api/items. Asi el
        # codigo de la API no depende del prefijo que le puso la
        # infraestructura (y moverlo a otro path no toca una linea de
        # python).
        #
        # /api/healthz entra por aca y llega como /healthz: el stub lo
        # responde, y el healthcheck del contenedor depende de eso.
        location = /api {
            return 301 /api/;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            # websocket: una API con /ws (chat, notificaciones) lo necesita.
            # Es el mismo bloque que el de node, por la misma razon.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # subidas grandes por la API (un CSV de 20 MB): el default de 60s
            # corta la conexion a mitad de camino y el cliente ve un 504.
            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            # websocket: sin esto, el dev con HMR ve "connection failed"
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }
    }
}
