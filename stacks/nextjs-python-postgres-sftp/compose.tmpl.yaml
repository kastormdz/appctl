# Generado por appctl desde stacks/nextjs-python-postgres-sftp/compose.tmpl.yaml
# NO EDITAR A MANO: los cambios se pierden en el proximo
# `appctl <proyecto> upgrade`, que lo re-renderiza desde este template.
#
# Datos persistentes: TODO en bind mounts dentro de este directorio.
# Nada de volumes nombrados, para que `destroy --keep-data` sea un rm -rf
# de una carpeta y el backup sea un tar de una carpeta.
name: appctl-__PROYECTO__

services:

  # ---------------------------------------------------------------- app ----
  # nginx + Next.js + uvicorn + sshd en un mismo contenedor. DOS runtimes
  # detras del MISMO nginx y del MISMO puerto:
  #
  #   /api/  -> 127.0.0.1:8000   (uvicorn + FastAPI)
  #   resto  -> 127.0.0.1:3000   (Next standalone)
  #
  # Por que juntos y no dos contenedores: el cliente tiene UN proyecto, UN
  # puerto y UN SFTP. Dos contenedores serian dos puertos que abrir, dos
  # chroots que mantener y el codigo repartido en dos uploads.
  app:
    image: __APP_IMAGE__
    # La imagen es local (la construye `appctl build` y la comparten todos
    # los proyectos). Sin esto, compose la intenta PULL de un registry que
    # no existe: "pull access denied for appctl/...".
    pull_policy: never
    container_name: __PROYECTO___app
    labels:
      appctl.proyecto: __PROYECTO__
      appctl.rol: app
      appctl.gestor: appctl


      # Sin esto hay que acordarse de los nombres, y con 30 proyectos en el
      # server `docker ps` deja de ser util.
    hostname: __PROYECTO__
    restart: unless-stopped
    environment:
      PROJECT: __PROYECTO__
__CRON__
      # pnpm install y pip install necesitan la red en RUNTIME, no solo en
      # el build: el cliente sube su codigo y las deps de los DOS runtimes
      # se instalan en el arranque. El proxy hace falta para que salgan a
      # internet (el registro de npm y pypi no se alcanzan sin el aca).
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      # PERO el healthcheck usa `curl`, que respeta el proxy: sin esto,
      # curl -qfsS http://127.0.0.1/healthz se lo mandaba AL PROXY de
      # corporativo en vez de al stub local, y el proxy respondia 403. El
      # contenedor quedaba unhealthy para siempre con node sano y nginx
      # proxyando bien: tres horas de diagnostico para descubrir que el
      # culpable era una variable de entorno que yo mismo puse.
      NO_PROXY: "localhost,127.0.0.1,::1,db,${PROJECT:-}"
      no_proxy: "localhost,127.0.0.1,::1,db,${PROJECT:-}"
      # Puerto de uvicorn DENTRO del contenedor. Lo lee python-launch.sh.
      # Vive en 127.0.0.1: no se publica al host, sale por nginx en /api.
      PY_PORT: "8000"
      SFTP_USER: ${SFTP_USER}
      SFTP_PASSWORD: ${SFTP_PASSWORD}
      SFTP_UID: ${SFTP_UID:-1001}
      SFTP_GID: ${SFTP_GID:-1000}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_READONLY_USER: ${DB_READONLY_USER}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
    volumes:
      # chroot del SFTP = webroot. UN solo bind mount para las dos cosas:
      # el cliente sube a /upload (en el host: sftp/home/upload) y nginx+fpm
      # sirven ESE MISMO directorio. Un lugar para el codigo, no dos que hay
      # que sincronizar. El chroot debe ser el mismo path que ve
      # ChrootDirectory y root:root 755, o sshd cierra la conexion.
      - ./sftp/home:/srv/sftp
      # /app es donde CORREN los dos runtimes: el entrypoint copia el
      # codigo del webroot (/srv/sftp/upload) ahi y buildea/instala si hace
      # falta.
      #   /app/           -> Next standalone (server.js)
      #   /app/backend/   -> la API Python (main.py + requirements.txt)
      - ./build:/app
      # vhost montado, no baked: se edita sin rebuild
      # SIN site.conf montado. El nginx.conf de la imagen YA hace el proxy a
    # 127.0.0.1:3000, y montar un conf.d/default.conf encima lo pisa: el
    # que llegaba era el de PHP (root /var/www/html, index index.php,
    # try_files =404) y node no recibia NADA. /healthz daba 403, el
    # healthcheck fallaba y el contenedor quedaba unhealthy para siempre
    # con el stub escuchando en 3000 y el log mostrando un 200 de otra ruta.
    #
    # Node no necesita un server block propio: su conf ya tiene el proxy,
    # el gzip y los websocket. Un conf.d aparte solo agrega un segundo
    # server peleando por el :80.
      # host keys del host: si no, cada recreate cambia la huella SSH y el
      # cliente ve un host distinto cada vez
      - /etc/ssh/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - /etc/ssh/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key:ro
      - /etc/ssh/ssh_host_ecdsa_key:/etc/ssh/ssh_host_ecdsa_key:ro
      # logs al stdout del contenedor (docker logs), no a un archivo
      - type: tmpfs
        target: /var/log/nginx
      - type: tmpfs
        target: /run
    ports:
      # el unico puerto web del proyecto (Next y la API salen por aca)
      - "__APP_PORT__:80"
      # sftp del proyecto
      - "__SFTP_PORT__:22"
    networks:
      - egress
      - data
    deploy:
      # Este stack corre DOS runtimes (node + python) bajo el mismo techo:
      # si la API es pesada, subir con APP_MEMORY en el .env del proyecto.
      #
      # Limite = TECHO, no reserva. Docker no commitmenta la memoria: el
      # kernel solo toma lo que el proceso pide. Medido con 4 stacks reales:
      # php 38 MB, next 36 MB, tomcat 102 MB, postgres 29 MB en reposo.
      #
      # Por que 512M y no 1G: en reposo da lo mismo (el proceso pide 40 MB
      # y toma 40 MB), pero el techo cae antes. Un cliente que se va de las
      # manos (un loop, una consulta sin limite) topa contra su 512M y se
      # muere SOLO, en vez de empujar a los otros 14.
      #
      # Para subirle a uno:  APP_MEMORY=2G en el .env del proyecto.
      # Para subirle a todos: editar el template y `appctl <p> upgrade`.
      #
      # NOTA de capacidad: esto NO limita cuantos clientes entran. Con 15 GB
      # y ~1 GB entre host y servicios, entran ~30 clientes en reposo. Si
      # hacen falta mas, la RAM del host se agranda en OpenStack (la VM es
      # Nova: se cambia el flavor y se reinicia), no bajando este numero.
      resources:
        limits:
          cpus: "${APP_CPUS:-1.0}"
          memory: ${APP_MEMORY:-512M}
    healthcheck:
      # LOS DOS runtimes: si uvicorn no arranca (requirements.txt roto,
      # main.py con un error de sintaxis), un healthcheck que solo mira
      # Next deja el contenedor en verde con la API caida.
      # El cliente tiene que responder GET /healthz (Next) y GET /healthz
      # en su API (que llega como /api/healthz). El stub ya hace las dos.
      test: ["CMD-SHELL", "curl -qfsS http://127.0.0.1/healthz >/dev/null && curl -qfsS http://127.0.0.1/api/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    # root por defecto: el entrypoint necesita crear el chroot con
    # root:root 755 y setear la password del usuario SFTP.

  # ----------------------------------------------------------------- db ----
  # SIN ports:. Ni uno. Vive en la red `data` (internal:true, sin gateway).
  # Inalcanzable desde el host y desde internet. Alcanzable desde `app`.
  db:
    image: postgres:__PG_VERSION__-alpine
    # esta si viene de docker hub: bajarla si no esta local
    pull_policy: missing
    container_name: __PROYECTO___db
    labels:
      appctl.proyecto: __PROYECTO__
      appctl.rol: db
      appctl.gestor: appctl
    hostname: __PROYECTO___db
    # Publicar la DB en el host es OPCIONAL y por defecto NO: el puerto
    # queda cerrado y la red data es internal:true, o sea que nadie de
    # afuera la alcanza. `appctl <p> db expose <puerto>` rellena esto.
__DB_PUBLISH__
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      # El superuser NO es el rol de la app. Con POSTGRES_USER = DB_USER
      # (los dosettel el mismo nombre) el init/10-roles.sh hacia
      # CREATE ROLE <lo mismo> y postgres contestaba
      # 'role "acme" already exists': con ON_ERROR_STOP=1 el script paraba
      # y los roles de migracion y readonly nunca se creaban. El proyecto
      # quedaba 'creado' con una base que solo el superuser podia usar.
      POSTGRES_USER: ${DB_ADMIN_USER}
      # La password del SUPERUSER, no la de la app: son usuarios
      # distintos con passwords distintas.
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
      # El init/10-roles.sh necesita estos para crear los tres roles del
      # proyecto (app / migracion / readonly). Con set -u, que faltara uno
      # daba 'DB_USER: unbound variable' en la linea 16 y el script SEGUIA:
      # los tres roles nunca se creaban y el error de postgres de verdad
      # era 'role "postgres" does not exist', que no senala el problema.
      # El proyecto quedaba 'creado' con una sola base y sin los roles.
      # Este stack los tenia SIN pasar al contenedor db (se heredo de la
      # copia de nextjs): el create daba 'faltan 3 de 3' en el check de
      # roles. Va aca, en el servicio db, no solo en el de la app.
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_READONLY_USER: ${DB_READONLY_USER}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    deploy:
      # Limites BAJOS a proposito. Medido en 4 stacks reales: php 38 MB,
      # next 36 MB, tomcat 102 MB de RAM en reposo. El limite no es una
      # reserva: es el techo antes de que un cliente se coma el server.
      # Con 512M un php aguanta ~13x lo que usa en reposo; 1G reservaba 7 GB
      # del server para 214 MB de trabajo real y a los 10 clientes no
      # entraba nada. Cambiar por proyecto: APP_MEMORY=2G en el .env.
      resources:
        limits:
          cpus: "${DB_CPUS:-0.75}"
          memory: ${DB_MEMORY:-512M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
networks:
  # con salida a internet: la app llama a una pasarela de pagos, a un SMTP,
  # a la API de un whatsapp. Sin esto, el cliente no puede cobrar. Y sin
  # esto, `pip install -r requirements.txt` no baja nada de pypi.
  egress:
    driver: bridge
  # SIN GATEWAY. La guarantee de que la DB no se ve desde afuera, hecha con
  # machinery y no con "no le puse ports:". Nadie la alcanza, ni siquiera
  # otro contenedor de otro proyecto.
  data:
    driver: bridge
    internal: true
