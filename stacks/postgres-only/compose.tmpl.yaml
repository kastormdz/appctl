# Generado por appctl desde stacks/postgres-only/compose.tmpl.yaml
# NO EDITAR A MANO: los cambios se pierden en el proximo
# `appctl <proyecto> upgrade`, que lo re-renderiza desde este template.
#
# STACK SOLO-BASE: un unico servicio (PostgreSQL). No hay app, no hay nginx,
# no hay SFTP: este proyecto ES la base. Se usa cuando la aplicacion del
# cliente corre en otro lado y solo necesita un PostgreSQL administrado.
#
# Datos persistentes: TODO en bind mounts dentro de este directorio (nada de
# volumes nombrados), para que `destroy --keep-data` sea un rm -rf de una
# carpeta y el backup sea un tar de una carpeta.
name: appctl-__PROYECTO__

services:

  db:
    image: postgres:__PG_VERSION__-alpine
    # esta si viene de docker hub: bajarla si no esta local
    pull_policy: missing
    container_name: __PROYECTO___db
    labels:
      appctl.proyecto: __PROYECTO__
      appctl.rol: db
      appctl.gestor: appctl
    hostname: __PROYECTO___db
    # La base arranca CERRADA: la red data es internal:true y no hay ports:.
    # `appctl <p> db expose` (sin puerto) toma el siguiente libre y lo anota
    # en state.json, asi sobrevive al proximo upgrade.
__DB_PUBLISH__
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      # El superuser NO es el rol de la app (ver php-postgres-sftp: si
      # coinciden, el init contesta 'already exists' y los otros dos roles
      # nunca se crean).
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_READONLY_USER: ${DB_READONLY_USER}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD}

    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-0.75}"
          memory: ${DB_MEMORY:-512M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  # Declarada pero NO usada al crear: `db expose` la agrega al servicio db
  # (docker no publica un puerto de una red internal:true). Sin la
  # declaracion, el compose quedaria invalido al exponer.
  egress:
    driver: bridge
  # SIN GATEWAY: mientras no se exponga, la base no la alcanza nadie.
  data:
    driver: bridge
    internal: true
