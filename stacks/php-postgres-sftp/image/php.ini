; Ajustes de app. Los limites duros van en el compose (deploy.resources),
; aca solo lo que no es recurso.
memory_limit = 512M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

date.timezone = America/Argentina/Buenos_Aires

; lado web: archivos subidos por SFTP, no ejecutables
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 40

; lado CLI (artisan, scripts): mas memoria y mas tiempo
memory_limit = 512M
max_execution_time = 120

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- sesion, cookies y wrappers remotos ------------------------------------
; Endurecimiento por defecto del stack. Los dos primeros valores se pueden
; pisar en runtime con una variable de entorno del proyecto (ver
; entrypoint.sh), porque hay casos legitimos en que no aplican:
;   APPCTL_SESSION_COOKIE_SECURE=0   app servida por HTTP plano
;   APPCTL_ALLOW_URL_FOPEN=On        app que hace file_get_contents() de una URL
;
; use_strict_mode: el id de sesion que manda el cliente tiene que existir ya
;   en el servidor. Sin esto el atacante fija el id y despues lo reusa
;   (session fixation).
; cookie_httponly: la cookie no se lee desde JavaScript; corta el robo de
;   sesion por XSS.
; cookie_secure: la cookie viaja solo por HTTPS. Con el TLS terminado en un
;   proxy adelante funciona igual, porque el que decide es el navegador y ve
;   HTTPS aunque el backend hable HTTP.
; cookie_samesite=Lax: la cookie no viaja en pedidos cross-site salvo en la
;   navegacion normal. Strict rompe el flujo de "vengo de un link externo".
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

; allow_url_fopen Off corta file_get_contents('http://...'), que es la via
; clasica de RFI y de SSRF por wrappers. Composer, Guzzle y wp_remote_get usan
; la extension curl (esta en la imagen), no fopen: no dependen de este valor.
allow_url_fopen = Off
allow_url_include = Off

; cgi.fix_pathinfo Off: con nginx + fastcgi, /upload/foto.jpg/x.php haria que
; PHP ejecute el .jpg. El `try_files $uri =404` del vhost ya lo frena; esto es
; la segunda barrera.
cgi.fix_pathinfo = 0
