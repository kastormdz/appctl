user  app;
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr "$request" $status $body_bytes_sent '
                      '"$http_referer" rt=$request_time';
    access_log  /dev/stdout  main;
    error_log   /dev/stderr  warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 64m;

    gzip  on;
    gzip_types  text/plain text/css application/json application/javascript
                application/xml text/xml image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /srv/sftp/upload;
        index index.php index.html;

        # Listado de directorios: apagado explicito.
        # nginx NO lista por defecto (a diferencia de Apache, que necesita
        # `Options -Indexes` en el .htaccess). Y el .htaccess que trae la app
        # aca no se lee NUNCA: nginx ignora las directivas de Apache. O sea
        # que el `Options -Indexes` que agrego el desarrollo no aporta nada
        # en este stack, pero tampoco hace falta: el equivalente ya esta
        # apagado. Se deja escrito para que un `autoindex on` de un include
        # futuro no abra el listado sin que nadie lo note.
        autoindex off;

        # /private es hermano de /upload dentro del chroot (solo SFTP): con
        # este root nunca se sirve. Doble barrera por si el root cambiara, y
        # disable_symlinks frena el truco del symlink upload/link -> ../private.
        location ^~ /private/ {
            deny all;
        }
        location = /private {
            deny all;
        }
        disable_symlinks on;

        # Cabeceras de seguridad. HSTS NO va aca: el TLS lo termina el proxy
        # de adelante, y un Strict-Transport-Security emitido por un backend
        # que habla HTTP no aplica al navegador (lo tiene que emitir el proxy).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ocultos y archivos sensibles: nunca
        location ~ /\.(?!well-known) {
            deny all;
        }
        location ~* \.(bak|old|orig|save|swp|sql|log|ini|sh)$ {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # un unico location para .php: ejecuta via fastcgi. El `try_files`
        # con `=404` hace que / no exista -> 404 en vez de mostrar el source.
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 120;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }
}
