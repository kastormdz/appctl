services:

  # ---------------------------------------------------------------- app ----
  # nginx + php-fpm + sshd en un mismo contenedor (igual que el stack de
  # postgres). Lo que cambia es la DB.
  app:
    # SIN build:. La imagen se construye UNA vez con `appctl build` y la
    # comparten todos los proyectos del mismo PHP. Un `build:` aca hace que
    # cada cliente nuevo compile la imagen entera, que es lo que NO quiero.
    # Si la imagen no existe, appctl create lo dice y te dice que corras
    # `appctl build` (no compila solo: fallar a medias es peor).
    image: __APP_IMAGE__
    # La imagen es local (la construye `appctl build` y la comparten todos
    # los proyectos). Sin esto, compose la intenta PULL de un registry que
    # no existe: "pull access denied for appctl/...".
    pull_policy: never
    container_name: __PROYECTO___app
    labels:
      appctl.proyecto: __PROYECTO__
      appctl.rol: app
      appctl.gestor: appctl
    hostname: __PROYECTO__
    restart: unless-stopped
    environment:
      PROJECT: __PROYECTO__
__CRON__
      SFTP_USER: ${SFTP_USER}
      SFTP_PASSWORD: ${SFTP_PASSWORD}
      SFTP_UID: ${SFTP_UID:-1001}
      SFTP_GID: ${SFTP_GID:-1000}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_READONLY_USER: ${DB_READONLY_USER}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
      # Overrides de endurecimiento de PHP. Vacios = los defaults de la
      # imagen (session.cookie_secure=1, allow_url_fopen=Off). Se define en el
      # .env del proyecto; el entrypoint escribe el php.ini de runtime.
      #   APPCTL_SESSION_COOKIE_SECURE=0   app servida por HTTP plano
      #   APPCTL_ALLOW_URL_FOPEN=On        app que hace file_get_contents()
      APPCTL_SESSION_COOKIE_SECURE: ${APPCTL_SESSION_COOKIE_SECURE:-}
      APPCTL_ALLOW_URL_FOPEN: ${APPCTL_ALLOW_URL_FOPEN:-}
    volumes:
      # chroot del SFTP = webroot. UN solo bind mount para las dos cosas:
      # el cliente sube a /upload (en el host: sftp/home/upload) y nginx+fpm
      # sirven ESE MISMO directorio. Un lugar para el codigo, no dos que hay
      # que sincronizar. El chroot debe ser el mismo path que ve
      # ChrootDirectory y root:root 755, o sshd cierra la conexion.
      - ./sftp/home:/srv/sftp
      # vhost montado, no baked: se edita sin rebuild
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      # host keys del host: si no, cada recreate cambia la huella SSH y el
      # cliente ve un host distinto cada vez
      - /etc/ssh/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - /etc/ssh/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key:ro
      - /etc/ssh/ssh_host_ecdsa_key:/etc/ssh/ssh_host_ecdsa_key:ro
      # logs al stdout del contenedor (docker logs), no a un archivo
      - type: tmpfs
        target: /var/log/nginx
      - type: tmpfs
        target: /run
    ports:
      - "__APP_PORT__:80"
      - "__SFTP_PORT__:22"
    networks:
      - egress
      - data
    deploy:
      # Limite = TECHO, no reserva. Docker no commitmenta la memoria: el
      # kernel solo toma lo que el proceso pide. Medido con 4 stacks reales:
      # php 38 MB, next 36 MB, tomcat 102 MB, postgres 29 MB en reposo.
      #
      # Por que 512M y no 1G: en reposo da lo mismo (el proceso pide 40 MB
      # y toma 40 MB), pero el techo cae antes. Un cliente que se va de las
      # manos (un loop, una consulta sin limite) topa contra su 512M y se
      # muere SOLO, en vez de empujar a los otros 14.
      #
      # Para subirle a uno:  APP_MEMORY=2G en el .env del proyecto.
      # Para subirle a todos: editar el template y `appctl <p> upgrade`.
      #
      # NOTA de capacidad: esto NO limita cuantos clientes entran. Con 15 GB
      # y ~1 GB entre host y servicios, entran ~30 clientes en reposo. Si
      # hacen falta mas, la RAM del host se agranda en OpenStack (la VM es
      # Nova: se cambia el flavor y se reinicia), no bajando este numero.
      resources:
        limits:
          cpus: "${APP_CPUS:-1.0}"
          memory: ${APP_MEMORY:-512M}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    # root por defecto: el entrypoint necesita crear el chroot con
    # root:root 755 y setear la password del usuario SFTP.

  # ----------------------------------------------------------------- db ----
  # SIN ports:. MariaDB en la red internal. Inalcanzable desde el host.
  db:
    image: mariadb:__MYSQL_VERSION__
    # esta si viene de docker hub: bajarla si no esta local
    pull_policy: missing
    container_name: __PROYECTO___db
    labels:
      appctl.proyecto: __PROYECTO__
      appctl.rol: db
      appctl.gestor: appctl
    hostname: __PROYECTO___db
    # Publicar la DB en el host es OPCIONAL y por defecto NO: el puerto
    # queda cerrado y la red data es internal:true, o sea que nadie de
    # afuera la alcanza. `appctl <p> db expose <puerto>` rellena esto.
__DB_PUBLISH__
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      # El root existe para el init/10-users.sh y para el check de roles,
      # que son las unicas dos cosas que lo usan. Ni la app ni el usuario de
      # migracion lo usan: cada uno entra con el suyo, por TCP y por red
      # propia.
      #
      # MariaDB 11.x genera una password de root y la imprime cuando el
      # volumen YA estaba inicializado (log: 'GENERATED ROOT PASSWORD'). Ahi
      # DB_ROOT_PASSWORD no sirve y el proyecto hay que recrearlo: por eso el
      # servicio avisa con 'db necesita recrearse' si no puede entrar.
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "no"
      # la app es el unico cliente: localhost no alcanza
      MARIADB_MYSQL_LOCALHOST_USER: ""
      # El init/10-users.sh necesita estas para crear los tres usuarios del
      # proyecto (app / migracion / readonly). Sin ellas el script falla con
      # 'DB_MIGRATION_USER: unbound variable' y -- como set -e no corta
      # adentro de una expansion de argumentos -- sigue y dice que los creo:
      # en la base quedan SOLO el usuario de la app, que crea la entrypoint
      # de mariadb por su cuenta (MARIADB_USER). Los otros dos no existen.
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_READONLY_USER: ${DB_READONLY_USER}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    deploy:
      # Limites BAJOS a proposito. Medido en 4 stacks reales: php 38 MB,
      # next 36 MB, tomcat 102 MB de RAM en reposo. El limite no es una
      # reserva: es el techo antes de que un cliente se coma el server.
      # Con 512M un php aguanta ~13x lo que usa en reposo; 1G reservaba 7 GB
      # del server para 214 MB de trabajo real y a los 10 clientes no
      # entraba nada. Cambiar por proyecto: APP_MEMORY=2G en el .env.
      resources:
        limits:
          cpus: "${DB_CPUS:-0.75}"
          memory: ${DB_MEMORY:-512M}
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  egress:
    driver: bridge
  data:
    driver: bridge
    internal: true
