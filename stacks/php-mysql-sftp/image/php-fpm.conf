; Pool unico. El proyecto es dueño de su codigo, asi que un solo pool con
; el usuario del proyecto: SFTP y PHP escriben en los mismos archivos.
[www]
user = app
group = app
listen = /run/php/php-fpm.sock
listen.owner = app
listen.group = app
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; que el error vaya a stdout, que es donde se lee con docker logs
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

clear_env = no
env[DB_HOST] = $DB_HOST
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASSWORD] = $DB_PASSWORD
