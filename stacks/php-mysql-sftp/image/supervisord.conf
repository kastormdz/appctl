[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# El usuario del proyecto: existe para que SFTP y PHP escreban los mismos
# archivos. Sin el, un archivo subido por SFTP (root) no lo puede leer php-fpm.
[program:fixperms]
command=/usr/local/bin/fixperms.sh
autostart=true
autorestart=false
startsecs=0
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:cron]
command=/usr/sbin/crond -f -l 8 -L /dev/stdout
# solo corre si el proyecto pidio cron: sin esto, todos los stacks
# tendrian un cron corriendo vacio.
autostart=false
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxsize=0
stderr_logfile=/dev/stderr
stderr_logfile_maxsize=0
