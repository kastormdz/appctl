user  app;
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr "$request" $status $body_bytes_sent '
                      '"$http_referer" rt=$request_time';
    access_log  /dev/stdout  main;
    error_log   /dev/stderr  warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 64m;

    gzip  on;
    gzip_types  text/plain text/css application/json application/javascript
                application/xml text/xml image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /srv/sftp/upload;
        index index.php index.html;

        # ocultos y archivos sensibles: nunca
        location ~ /\.(?!well-known) {
            deny all;
        }
        location ~* \.(bak|old|orig|save|swp|sql|log|ini|sh)$ {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # un unico location para .php: ejecuta via fastcgi. El `try_files`
        # con `=404` hace que / no exista -> 404 en vez de mostrar el source.
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 120;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }
}
